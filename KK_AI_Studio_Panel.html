<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KK AI Studio Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f3f3;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        .animation {
            width: 100px;
            height: 100px;
            background-color: #4CAF50;
            margin: auto;
            animation: bounce 1s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-30px);
            }
            60% {
                transform: translateY(-15px);
            }
        }
    </style>
</head>
<body>
    <h1>KK AI Studio Panel</h1>
    <div class="animation"></div>
    <audio controls>
        <source src="path_to_urdu_voice_message.mp3" type="audio/mp3">
        Your browser does not support the audio tag.
    </audio>
    <script>
        function advancedPrediction() {
            // Prediction logic goes here
            console.log('Advanced prediction script activated.');
        }
        advancedPrediction();
    </script>
</body>
</html>
